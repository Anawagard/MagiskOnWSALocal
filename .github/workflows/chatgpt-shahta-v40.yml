name: Build Shahta Bez Dna v4.6 Android APK
on:
  push:
    branches:
      - chatgpt-shahta-v40-redesign-20261102
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore and statically verify game 3.2
        run: |
          python3 -m pip install --disable-pip-version-check brotli
          python3 - <<'PY'
          import base64,brotli,io,pathlib,tarfile
          path=pathlib.Path("chatgpt-shahta-v32/source.tar.br.base64")
          project=pathlib.Path("chatgpt-shahta-v33/project")
          project.mkdir(parents=True,exist_ok=True)
          packed=brotli.decompress(base64.b64decode(path.read_text()))
          with tarfile.open(fileobj=io.BytesIO(packed)) as t:
              t.extractall(project,filter="data")
          source=(project/"app/src/main/java/com/bezdna/mine/MineView.java").read_text()
          required=["drawCaveWeather(","drawEncounterEffects(","drawMastery(","startTrial(","updateTrial(","modifier()","perfectStrikes","buyMastery(","pageSlide","volatileSeconds","trialDeadline"]
          assert len(source)>80000, len(source)
          assert all(v in source for v in required),[v for v in required if v not in source]
          gradle=(project/"app/build.gradle").read_text()
          assert "versionCode 7" in gradle and "versionName '3.2'" in gradle
          assert (project/"app/src/main/res/drawable-nodpi/game_icon.png").stat().st_size>20000
          print("v3.8 game source validated:",len(source),"characters")
          PY
      - name: Inspect source targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("chatgpt-shahta-v33/project/app/src/main")
          for f in p.rglob("*.java"):
              print("JAVA",f)
              for i,line in enumerate(f.read_text().splitlines(),1):
                  if any(w in line.lower() for w in ["biome","upgrade","level","fullscreen","immersive","setflags","system_ui","mastery","rank","skill"]):
                      if len(line)<500: print(i,line[:430])
          for f in p.rglob("AndroidManifest.xml"):print("MANIFEST",f.read_text()[:2000])
          PY
      - name: Apply v3.3 changes
        run: |
          python3 chatgpt-shahta-v33/patch_game.py
      - name: Inspect balance and shop code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path("chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java")
          a=f.read_text().splitlines()
          for p,q in [(40,90),(210,245),(275,330),(1120,1180),(1370,1470)]:
              print("SECTION",p,q)
              for j in range(p-1,min(q,len(a))):print(f"{j+1}: {a[j]}")
          PY
      - name: Apply v3.4 balance and upgrade overhaul
        run: |
          python3 chatgpt-shahta-v34/patch_game.py
      - name: Locate version badge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java")
          for i,line in enumerate(p.read_text().splitlines(),1):
              if "3.2" in line or "ВЕРС" in line or "верси" in line.lower() or "SHAHTA" in line:
                  print(i,line[:500])
          PY
      - name: Refresh version label
        run: python3 chatgpt-shahta-v35/patch_version.py
      - name: Add sound and effects settings
        run: python3 chatgpt-shahta-v36/patch_audio.py
      - name: Install recorded rock sound effects
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p chatgpt-shahta-v33/project/app/src/main/res/raw
          curl -fL --retry 3 -A "ShahtaGame/3.7 (sound effect processing)" "https://commons.wikimedia.org/wiki/Special:Redirect/file/Grinding_and_tapping_ro.ogg" -o /tmp/rock_foley.ogg
          test "$(stat -c%s /tmp/rock_foley.ogg)" -gt 100000
          ffmpeg -hide_banner -loglevel error -y -ss 4 -i /tmp/rock_foley.ogg -t 0.32 -ar 22050 -ac 1 -filter:a "loudnorm" chatgpt-shahta-v33/project/app/src/main/res/raw/stone_hit.wav
          ffmpeg -hide_banner -loglevel error -y -ss 10 -i /tmp/rock_foley.ogg -t 0.68 -ar 22050 -ac 1 -filter:a "loudnorm" chatgpt-shahta-v33/project/app/src/main/res/raw/stone_crack.wav
          ffmpeg -hide_banner -loglevel error -y -ss 18 -i /tmp/rock_foley.ogg -t 0.30 -ar 22050 -ac 1 -filter:a "loudnorm" chatgpt-shahta-v33/project/app/src/main/res/raw/metal_hit.wav
          python3 chatgpt-shahta-v37/patch_real_audio.py
          test -s chatgpt-shahta-v33/project/app/src/main/res/raw/stone_hit.wav
      - name: Remove header version
        run: python3 chatgpt-shahta-v38/patch_header.py
      - name: Add precise volume slider
        run: python3 chatgpt-shahta-v39/patch_volume_slider.py
      - name: Add rich veins and gameplay rewards
        run: python3 chatgpt-shahta-v310/patch_rich_veins.py
      - name: Apply v4.0 cave lighting
        run: python3 chatgpt-shahta-v311/patch_visual.py
      - name: Apply v4.0 scene redesign
        run: python3 chatgpt-shahta-v40/patch_redesign.py
      - name: Apply global v4.1 UI and world art
        run: python3 chatgpt-shahta-v40/patch_global_ui.py
      - name: Apply v4.2 full-screen art overhaul
        run: python3 chatgpt-shahta-v40/patch_art_v42.py
      - name: Check visual hooks and save compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java")
          s=p.read_text()
          for method in ["drawV42OreHighlights","drawV4Scene","drawHeader","drawBottom","drawParticles","drawOreCrystal","drawRock","powerButton","nav","button","bar","panel"]:
              assert method+"(" in s, method
          assert "drawV4Scene(c,biome,tint)" not in s
          assert "drawV4Scene(c,biome,theme)" in s
          assert 'prefs.edit()' in s and 'public void save()' in s
          assert 'private void rebirth()' in s
          print("All 12 rendering hooks and save/rebirth methods verified")
          PY
      - name: Apply v4.3 illustrated menus and atlas
        run: python3 chatgpt-shahta-v40/patch_art_v43.py
      - name: Verify v4.3 menu rendering hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java").read_text()
          for hook in ["drawV43PageAtmosphere","drawV43Sigil","drawV43AtlasThumbnail"]:
              assert s.count("private void "+hook+"(")==1,hook
          assert "drawV43PageAtmosphere(c,tab)" in s
          assert "drawV43AtlasThumbnail(c,53,y+38,bi)" in s
          print("v4.3 menu art hooks verified")
          PY
      - name: Apply v4.4 save backup and persistence fix
        run: python3 chatgpt-shahta-v40/patch_save_v44.py
      - name: Verify save export/import and all six technologies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine")
          game=(root/"MineView.java").read_text()
          main=(root/"MainActivity.java").read_text()
          assert 'for(int i=0;i<6;i++)ed.putInt("tech_"+i,tech[i]);' in game
          assert 'exportSave()' in main and 'importSave()' in main
          assert 'shahta-save-v1' in main and 'mine_save_v1' in main
          assert 'ACTION_CREATE_DOCUMENT' in main and 'ACTION_OPEN_DOCUMENT' in main
          print("Backup, restore, and six-upgrade persistence verified")
          PY
      - name: Apply v4.5 boss and treasure redesign
        run: python3 chatgpt-shahta-v40/patch_art_v45.py
      - name: Verify v4.5 special ore art
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java").read_text()
          for name in ["drawV45Guardian","drawV45Treasure","drawV45Geode"]:
              assert s.count("private void "+name+"(")==1,name
          assert "if(guardian())drawV45Guardian(c);" in s
          assert "if(treasure())drawV45Treasure(c);" in s
          assert "if(geode())drawV45Geode(c);" in s
          rounded=s[s.index("private void round("):s.index("private void grad(")]
          assert "new LinearGradient" not in rounded
          print("v4.5 special ore renderers and low-allocation rounded UI verified")
          PY
      - name: Apply v4.6 biome and signing polish
        run: python3 chatgpt-shahta-v40/patch_polish_v46.py
      - name: Verify explicit cached debug signing config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path("chatgpt-shahta-v33/project/app/build.gradle").read_text()
          assert "signingConfig signingConfigs.shahtaDebug" in g
          assert "versionCode 23" in g and "versionName '4.6'" in g
          assert "/.android/debug.keystore" in g
          print("Explicit stable debug signing configured")
          PY
      - name: Export rendered game source for visual audit
        run: |
          mkdir -p inspection
          cp chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java inspection/MineView.java
          cp chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MainActivity.java inspection/MainActivity.java
          cp chatgpt-shahta-v33/project/app/build.gradle inspection/build.gradle
      - uses: actions/upload-artifact@v4
        with:
          name: Shahta-v46-source-inspection
          path: inspection/*
          if-no-files-found: error
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      # Debug-only identity. GitHub cache persists the same debug certificate across
      # successive CI runs on this branch. Never use it for a production release.
      - name: Restore debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shahta-v44-debug-keystore-20261102
      - name: Initialize debug signing identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Shahta Debug,O=Anawagard,C=RU" -noprompt
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep SHA256
      - name: Build standard game APK
        working-directory: chatgpt-shahta-v33/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify standard game APK
        run: |
          mkdir -p artifacts
          cp chatgpt-shahta-v33/project/app/build/outputs/apk/debug/app-debug.apk artifacts/Shahta-Bez-Dna-v4.6.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/Shahta-Bez-Dna-v4.6.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/Shahta-Bez-Dna-v4.6.apk | head -n 4
          unzip -t artifacts/Shahta-Bez-Dna-v4.6.apk | tail -n 1
          unzip -l artifacts/Shahta-Bez-Dna-v4.6.apk | grep game_icon.png
      - name: Check APK signing certificate matches cached identity
        run: |
          set -euo pipefail
          expected="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          actual="$(keytool -printcert -jarfile artifacts/Shahta-Bez-Dna-v4.6.apk | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          echo "Expected signing certificate: $expected"
          echo "Actual APK certificate: $actual"
          test "$expected" = "$actual"
      - name: Configure side-by-side installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("chatgpt-shahta-v33/project")
          gradle=root/"app/build.gradle"
          s=gradle.read_text()
          assert "applicationId 'com.bezdna.mine'" in s
          gradle.write_text(s.replace("applicationId 'com.bezdna.mine'","applicationId 'com.bezdna.mine.v40'"))
          manifest=root/"app/src/main/AndroidManifest.xml"
          s=manifest.read_text()
          assert 'android:label="Шахта без дна"' in s
          manifest.write_text(s.replace('android:label="Шахта без дна"','android:label="Шахта без дна 4.6"'))
          PY
      - name: Build side-by-side game APK
        working-directory: chatgpt-shahta-v33/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify side-by-side game APK
        run: |
          cp chatgpt-shahta-v33/project/app/build/outputs/apk/debug/app-debug.apk artifacts/Shahta-Bez-Dna-v4.6-Parallel.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/Shahta-Bez-Dna-v4.6-Parallel.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/Shahta-Bez-Dna-v4.6-Parallel.apk | head -n 4
          unzip -t artifacts/Shahta-Bez-Dna-v4.6-Parallel.apk | tail -n 1
          sha256sum artifacts/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shahta-Bez-Dna-v4.6-APKs
          path: artifacts/*.apk
          if-no-files-found: error

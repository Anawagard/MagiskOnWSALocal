name: Build Shahta Bez Dna v7.0.1 Android APK
# Full v7.0.1 release validated; further intermediate commits must not build APK.
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore and statically verify game 3.2
        run: |
          python3 -m pip install --disable-pip-version-check brotli
          python3 - <<'PY'
          import base64,brotli,io,pathlib,tarfile
          path=pathlib.Path("chatgpt-shahta-v32/source.tar.br.base64")
          project=pathlib.Path("chatgpt-shahta-v33/project")
          project.mkdir(parents=True,exist_ok=True)
          packed=brotli.decompress(base64.b64decode(path.read_text()))
          with tarfile.open(fileobj=io.BytesIO(packed)) as t:
              t.extractall(project,filter="data")
          source=(project/"app/src/main/java/com/bezdna/mine/MineView.java").read_text()
          required=["drawCaveWeather(","drawEncounterEffects(","drawMastery(","startTrial(","updateTrial(","modifier()","perfectStrikes","buyMastery(","pageSlide","volatileSeconds","trialDeadline"]
          assert len(source)>80000, len(source)
          assert all(v in source for v in required),[v for v in required if v not in source]
          gradle=(project/"app/build.gradle").read_text()
          assert "versionCode 7" in gradle and "versionName '3.2'" in gradle
          assert (project/"app/src/main/res/drawable-nodpi/game_icon.png").stat().st_size>20000
          print("v3.8 game source validated:",len(source),"characters")
          PY
      - name: Inspect source targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("chatgpt-shahta-v33/project/app/src/main")
          for f in p.rglob("*.java"):
              print("JAVA",f)
              for i,line in enumerate(f.read_text().splitlines(),1):
                  if any(w in line.lower() for w in ["biome","upgrade","level","fullscreen","immersive","setflags","system_ui","mastery","rank","skill"]):
                      if len(line)<500: print(i,line[:430])
          for f in p.rglob("AndroidManifest.xml"):print("MANIFEST",f.read_text()[:2000])
          PY
      - name: Apply v3.3 changes
        run: |
          python3 chatgpt-shahta-v33/patch_game.py
      - name: Inspect balance and shop code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path("chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java")
          a=f.read_text().splitlines()
          for p,q in [(40,90),(210,245),(275,330),(1120,1180),(1370,1470)]:
              print("SECTION",p,q)
              for j in range(p-1,min(q,len(a))):print(f"{j+1}: {a[j]}")
          PY
      - name: Apply v3.4 balance and upgrade overhaul
        run: |
          python3 chatgpt-shahta-v34/patch_game.py
      - name: Locate version badge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java")
          for i,line in enumerate(p.read_text().splitlines(),1):
              if "3.2" in line or "ВЕРС" in line or "верси" in line.lower() or "SHAHTA" in line:
                  print(i,line[:500])
          PY
      - name: Refresh version label
        run: python3 chatgpt-shahta-v35/patch_version.py
      - name: Add sound and effects settings
        run: python3 chatgpt-shahta-v36/patch_audio.py
      - name: Install recorded rock sound effects
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p chatgpt-shahta-v33/project/app/src/main/res/raw
          curl -fL --retry 3 -A "ShahtaGame/3.7 (sound effect processing)" "https://commons.wikimedia.org/wiki/Special:Redirect/file/Grinding_and_tapping_ro.ogg" -o /tmp/rock_foley.ogg
          test "$(stat -c%s /tmp/rock_foley.ogg)" -gt 100000
          ffmpeg -hide_banner -loglevel error -y -ss 4 -i /tmp/rock_foley.ogg -t 0.32 -ar 22050 -ac 1 -filter:a "loudnorm" chatgpt-shahta-v33/project/app/src/main/res/raw/stone_hit.wav
          ffmpeg -hide_banner -loglevel error -y -ss 10 -i /tmp/rock_foley.ogg -t 0.68 -ar 22050 -ac 1 -filter:a "loudnorm" chatgpt-shahta-v33/project/app/src/main/res/raw/stone_crack.wav
          ffmpeg -hide_banner -loglevel error -y -ss 18 -i /tmp/rock_foley.ogg -t 0.30 -ar 22050 -ac 1 -filter:a "loudnorm" chatgpt-shahta-v33/project/app/src/main/res/raw/metal_hit.wav
          python3 chatgpt-shahta-v37/patch_real_audio.py
          test -s chatgpt-shahta-v33/project/app/src/main/res/raw/stone_hit.wav
      - name: Remove header version
        run: python3 chatgpt-shahta-v38/patch_header.py
      - name: Add precise volume slider
        run: python3 chatgpt-shahta-v39/patch_volume_slider.py
      - name: Add rich veins and gameplay rewards
        run: python3 chatgpt-shahta-v310/patch_rich_veins.py
      - name: Apply v4.0 cave lighting
        run: python3 chatgpt-shahta-v311/patch_visual.py
      - name: Apply v4.0 scene redesign
        run: python3 chatgpt-shahta-v40/patch_redesign.py
      - name: Apply global v4.1 UI and world art
        run: python3 chatgpt-shahta-v40/patch_global_ui.py
      - name: Apply v4.2 full-screen art overhaul
        run: python3 chatgpt-shahta-v40/patch_art_v42.py
      - name: Check visual hooks and save compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java")
          s=p.read_text()
          for method in ["drawV42OreHighlights","drawV4Scene","drawHeader","drawBottom","drawParticles","drawOreCrystal","drawRock","powerButton","nav","button","bar","panel"]:
              assert method+"(" in s, method
          assert "drawV4Scene(c,biome,tint)" not in s
          assert "drawV4Scene(c,biome,theme)" in s
          assert 'prefs.edit()' in s and 'public void save()' in s
          assert 'private void rebirth()' in s
          print("All 12 rendering hooks and save/rebirth methods verified")

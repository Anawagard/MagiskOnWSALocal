      - name: Restore debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shahta-v44-debug-keystore-20261102
      - name: Initialize debug signing identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Shahta Debug,O=Anawagard,C=RU" -noprompt
          fi
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          test -n "$actual"
          echo "Debug signing certificate: $actual"
      - name: Build standard game APK
        working-directory: chatgpt-shahta-v33/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify standard game APK
        run: |
          mkdir -p artifacts
          cp chatgpt-shahta-v33/project/app/build/outputs/apk/debug/app-debug.apk artifacts/Shahta-Bez-Dna-v7.0.1.apk

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/Shahta-Bez-Dna-v7.0.1.apk | head -n 4
          unzip -t artifacts/Shahta-Bez-Dna-v7.0.1.apk | tail -n 1
          unzip -l artifacts/Shahta-Bez-Dna-v7.0.1.apk | grep game_icon.png
          sha256sum artifacts/Shahta-Bez-Dna-v7.0.1.apk
      - name: Check APK signing certificate matches build identity
        run: |
          set -euo pipefail
          expected="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          actual="$(keytool -printcert -jarfile artifacts/Shahta-Bez-Dna-v7.0.1.apk | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          echo "Expected signing certificate: $expected"
          echo "Actual APK certificate: $actual"
          test "$expected" = "$actual"
      - uses: actions/upload-artifact@v4
        with:
          name: Shahta-Bez-Dna-v7.0.1-APK
          path: artifacts/Shahta-Bez-Dna-v7.0.1.apk
          if-no-files-found: error

  android-smoke:
    name: Android emulator launch and screenshots
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Final release requires successful emulator installation and smoke checks.
    # Infrastructure failures are retried or fixed before an APK is published.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Shahta-Bez-Dna-v7.0.1-APK
          path: smoke-apks
      - name: Enable hardware-accelerated Android emulator when KVM is available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM available: enabling acceleration"
            ls -l /dev/kvm
          else
            echo "::warning::KVM unavailable; emulator will use slow software emulation"
          fi
      - name: Boot emulator, launch game and capture 3 screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -camera-back none -cores 2 -memory 2048
          script: bash chatgpt-shahta-v40/android_smoke_v70.sh
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shahta-v70-android-smoke-screenshots
          path: screenshots/
          if-no-files-found: warn

          assert "drawV53LivingOreGlints(c,id,damageRatio);" in s
          assert "drawV57BiomeRelics(c,biome,bcol);" in s
          assert 'for(int i=0;i<6;i++)ed.putInt("tech_"+i,tech[i]);' in s
          assert "public void save()" in s and "private void rebirth()" in s
          assert "versionCode 35" in g and "versionName '5.8'" in g
          assert "signingConfig signingConfigs.shahtaDebug" in g
          print("v5.8 24 distinct cached silhouettes, clipping, saves and debug identity verified")
          PY
      - name: Apply v5.9 dynamic mining debris and ore-edge chipping
        run: python3 chatgpt-shahta-v40/patch_shards_v59.py
      - name: Verify v5.9 physics hooks, rendering budget and saved state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("chatgpt-shahta-v33/project")
          s=(root/"app/src/main/java/com/bezdna/mine/MineView.java").read_text()
          g=(root/"app/build.gradle").read_text()
          for hook in ("spawnV59Shards","drawV59Shards","drawV59SurfaceChips"):
              assert s.count("private void "+hook+"(")==1,hook
          assert "drawV59SurfaceChips(c,id,damageRatio);" in s
          assert "drawV59Shards(c);" in s
          assert "spawnV59Shards(180,329,found,true,true);" in s
          assert "spawnV59Shards(180,330,ore(),critical,false);" in s
          assert "if(v59Shards.size()+count>64)" in s
          assert "if(measuredFps<30f)" in s
          assert "c.clipPath(v58RockShape(id));" in s
          assert "drawV57BiomeRelics(c,biome,bcol);" in s
          assert "drawV55NavIcon(c,x+32.5f,678+bounce,tab,selected);" in s
          assert 'for(int i=0;i<6;i++)ed.putInt("tech_"+i,tech[i]);' in s
          assert "public void save()" in s and "private void rebirth()" in s
          assert "versionCode 36" in g and "versionName '5.9'" in g
          assert "signingConfig signingConfigs.shahtaDebug" in g
          print("v5.9 transient shards, 24 ore outlines, input/save compatibility and signing verified")
          PY
      - name: Export rendered game source for visual audit
        run: |
          mkdir -p inspection
          cp chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MineView.java inspection/MineView.java
          cp chatgpt-shahta-v33/project/app/src/main/java/com/bezdna/mine/MainActivity.java inspection/MainActivity.java
          cp chatgpt-shahta-v33/project/app/build.gradle inspection/build.gradle
      - uses: actions/upload-artifact@v4
        with:
          name: Shahta-v59-source-inspection
          path: inspection/*
          if-no-files-found: error
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      # Debug-only identity. GitHub cache persists the same debug certificate across
      # successive CI runs on this branch. Never use it for a production release.
      - name: Restore debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shahta-v44-debug-keystore-20261102
      - name: Initialize debug signing identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Shahta Debug,O=Anawagard,C=RU" -noprompt
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep SHA256
          pinned="CB:A5:21:97:28:75:54:86:04:AF:46:EF:77:43:1E:15:5F:17:FA:DD:90:1C:77:2C:83:9B:38:89:B8:1C:83:A0"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          if [ "$actual" != "$pinned" ]; then
            echo "::error::Debug signing identity differs from v4.6. Refusing incompatible APK."
            exit 1
          fi
      - name: Build standard game APK
        working-directory: chatgpt-shahta-v33/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify standard game APK
        run: |
          mkdir -p artifacts
          cp chatgpt-shahta-v33/project/app/build/outputs/apk/debug/app-debug.apk artifacts/Shahta-Bez-Dna-v5.9.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/Shahta-Bez-Dna-v5.9.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/Shahta-Bez-Dna-v5.9.apk | head -n 4
          unzip -t artifacts/Shahta-Bez-Dna-v5.9.apk | tail -n 1
          unzip -l artifacts/Shahta-Bez-Dna-v5.9.apk | grep game_icon.png
      - name: Check APK signing certificate matches cached identity
        run: |
          set -euo pipefail
          expected="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          actual="$(keytool -printcert -jarfile artifacts/Shahta-Bez-Dna-v5.9.apk | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          echo "Expected signing certificate: $expected"
          echo "Actual APK certificate: $actual"
          test "$expected" = "$actual"
      - name: Configure side-by-side installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("chatgpt-shahta-v33/project")
          gradle=root/"app/build.gradle"
          s=gradle.read_text()
          assert "applicationId 'com.bezdna.mine'" in s
          gradle.write_text(s.replace("applicationId 'com.bezdna.mine'","applicationId 'com.bezdna.mine.v40'"))
          manifest=root/"app/src/main/AndroidManifest.xml"
          s=manifest.read_text()
          assert 'android:label="Шахта без дна"' in s
          manifest.write_text(s.replace('android:label="Шахта без дна"','android:label="Шахта без дна 5.9"'))
          PY
      - name: Build side-by-side game APK
        working-directory: chatgpt-shahta-v33/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify side-by-side game APK
        run: |
          cp chatgpt-shahta-v33/project/app/build/outputs/apk/debug/app-debug.apk artifacts/Shahta-Bez-Dna-v5.9-Parallel.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/Shahta-Bez-Dna-v5.9-Parallel.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/Shahta-Bez-Dna-v5.9-Parallel.apk | head -n 4
          unzip -t artifacts/Shahta-Bez-Dna-v5.9-Parallel.apk | tail -n 1
          sha256sum artifacts/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shahta-Bez-Dna-v5.9-APKs
          path: artifacts/*.apk
          if-no-files-found: error

  android-smoke:
    name: Android emulator launch and screenshots
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Emulator infrastructure can be unavailable on some runners. APK build
    # and signature checks remain mandatory; smoke result is reported separately.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Shahta-Bez-Dna-v5.9-APKs
          path: smoke-apks
      - name: Enable hardware-accelerated Android emulator when KVM is available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM available: enabling acceleration"
            ls -l /dev/kvm
          else
            echo "::warning::KVM unavailable; emulator will use slow software emulation"
          fi
      - name: Boot emulator, launch game and capture 3 screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -camera-back none -cores 2 -memory 2048
          script: bash chatgpt-shahta-v40/android_smoke_v53.sh
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shahta-v59-android-smoke-screenshots
          path: screenshots/
          if-no-files-found: warn

name: Build isolated Notion RU APK
on:
  push:
    branches: [chatgpt-build-notion-ru-20261029]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack isolated Android app
        run: |
          python -m pip install --user brotli
          python - <<'PY'
          import base64,brotli,tarfile,io
          raw=base64.b64decode(open('chatgpt-notion-build/notion-source.tar.br.base64').read())
          payload=brotli.decompress(raw)
          with tarfile.open(fileobj=io.BytesIO(payload),mode='r:') as tar:
            tar.extractall(path='chatgpt-notion-build/project',filter='data')
          PY
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: chatgpt-notion-build/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Notion-RU-Android-APK
          path: chatgpt-notion-build/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

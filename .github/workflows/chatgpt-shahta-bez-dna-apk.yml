name: Build Shahta Bez Dna APK
on:
  push:
    branches:
      - chatgpt-build-shahta-bez-dna-20261029
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original Android game project
        run: |
          python3 -m pip install brotli
          python3 - <<'PY'
          import base64, brotli, io, pathlib, tarfile
          data = base64.b64decode(pathlib.Path('chatgpt-shahta-build/source.tar.br.base64').read_text())
          archive_data = brotli.decompress(data)
          target = pathlib.Path('chatgpt-shahta-build/BezDnaMine')
          target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive_data), mode='r') as archive:
              archive.extractall(target, filter='data')
          print('Source files restored:', [str(p.relative_to(target)) for p in target.rglob('*') if p.is_file()])
          PY
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: chatgpt-shahta-build/BezDnaMine
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and package
        run: |
          APK="chatgpt-shahta-build/BezDnaMine/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify -v "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -30
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Shahta-Bez-Dna-Android-APK
          path: chatgpt-shahta-build/BezDnaMine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
